name: Native C++26
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate native-only inventory, resources and audited data baseline
        run: python3 tools/validate_native.py
      - name: Build and run portable tests
        run: |
          mkdir -p artifacts/portable
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -Inative -Itests -DMM_PORTABLE_MAIN tests/PortableTests.cpp native/OneCoreUAP.cpp -o artifacts/portable/tests
          artifacts/portable/tests
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
      - name: Build native solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $log = 'artifacts/msbuild-${{ matrix.platform }}-${{ matrix.configuration }}.log'
          msbuild Magicmida.slnx /m /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /bl:artifacts/build-${{ matrix.platform }}-${{ matrix.configuration }}.binlog 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errors = @(Get-Content $log | Select-String -Pattern ': (fatal )?error( |:)|error MSB[0-9]+' | Select-Object -Last 25)
            if (-not $errors.Count) { $errors = @(Get-Content $log | Select-Object -Last 20) }
            foreach ($line in $errors) {
              $message = "$line".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=MSVC build diagnostic::$message"
            }
            exit $code
          }
      - name: Test native core and CLI
        shell: pwsh
        run: |
          $log = 'artifacts/tests-${{ matrix.platform }}-${{ matrix.configuration }}.log'
          try {
            ./tools/Test-Native.ps1 -Platform '${{ matrix.platform }}' -Configuration '${{ matrix.configuration }}' *>&1 | Tee-Object -FilePath $log
          } catch {
            $message = "$($_.Exception.Message)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native test failure::$message"
            if (Test-Path $log) {
              foreach ($line in (Get-Content $log | Select-Object -Last 20)) {
                $message = "$line".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Native test diagnostic::$message"
              }
            }
            exit 1
          }
      - name: Upload binaries and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Magicmida-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            artifacts/bin/${{ matrix.platform }}/${{ matrix.configuration }}/
            artifacts/build-${{ matrix.platform }}-${{ matrix.configuration }}.binlog
            artifacts/*-${{ matrix.platform }}-${{ matrix.configuration }}.log
          if-no-files-found: warn
